name: Vivaticket Checker

on:
  # 10分おきに自動実行するスケジュール設定
  schedule:
    - cron: '*/10 * * * *'
  # GitHubの画面から手動でも実行できるようにする設定
  workflow_dispatch:

# リポジトリに対する書き込み権限（status.jsonの更新・保存用）
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pythonの実行環境（バージョン3.10）をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 必要なライブラリとブラウザ（Playwright/Chromium）をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright beautifulsoup4
          playwright install --with-deps chromium

      # 4. チケットの空き状況チェックプログラムを実行
      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python check.py

      # 5. 空き状況の変化（status.jsonの更新）があれば自動でコミット＆プッシュ
      - name: Commit and push status changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add status.json
          git status
          git diff --staged --quiet || (git commit -m "Update ticket status cache" && git push)
